name: probe (temporary)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/128"
          curl -sL --max-time 30 -A "$UA" "https://www.pohang.go.kr/phtour/wmap/festival/index.do?date_type=2&menu_idx=75&org_code=0001" > a.html
          python3 - <<'PY'
          import re
          h=open('a.html',encoding='utf-8',errors='ignore').read()
          i=h.find('포포틴'); print("=====LIST"); print(h[i-3000:i+3500])
          j=h.find('pagination') if 'pagination' in h else h.find('paging'); print("=====PAGING"); print(h[j-200:j+1500])
          m=re.search(r'href="([^"]*festival/view[^"]*)"',h) or re.search(r'href="([^"]*(?:view|detail)[^"]*idx=[^"]*)"',h); print("=====VIEWURL",m and m.group(1))
          PY
