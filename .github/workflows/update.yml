name: 데이터 자동 갱신 및 배포
on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST (UTC 21:00)
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: 데이터 수집 (네이버 플레이스)
        if: github.event_name != 'push'
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TZ: Asia/Seoul
        run: |
          python update.py
          python new_openings.py || echo "new_openings 실패 (무시)"
      - name: 변경사항 커밋
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data.json img sns_snapshot.json new_openings.json new_openings_seen.json
          if git diff --cached --quiet; then echo "변경 없음"; else git commit -m "데이터 자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')" && git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
