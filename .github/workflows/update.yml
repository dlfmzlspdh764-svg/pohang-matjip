name: 데이터 자동 갱신 및 배포
on:
  schedule:
    - cron: "0 21 * * *"              # 매일 06:00 KST: 전체 갱신(update.py) + 핫플
    - cron: "0 23,2,5,8,11,14 * * *"  # 08·11·14·17·20·23시 KST: 핫플(hot.py)만
  workflow_dispatch:
    inputs:
      mode:
        description: "full = 전체 갱신+행사+핫플, hot = 핫플만, events = 행사/축제만"
        default: hot
        type: choice
        options: [hot, full, events]
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: 행사/축제 갱신 (포항시 문화관광·한국관광공사·뉴스)
        if: github.event.schedule == '0 21 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'full' || inputs.mode == 'events'))
        run: python events.py || echo "events 실패 (이전 events.json 유지)"
      - name: 전체 갱신 (네이버 플레이스)
        if: github.event.schedule == '0 21 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          python update.py
          python new_openings.py || echo "new_openings 실패 (무시)"
      - name: 핫플 계산 (블로그·리뷰 급상승)
        if: github.event_name != 'push' && inputs.mode != 'events'
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          python social_probe.py || true
          python hot.py
      - name: 변경사항 커밋
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data.json img sns_snapshot.json new_openings.json new_openings_seen.json hot.json history seeds.json social_probe.json events.json ev
          if git diff --cached --quiet; then echo "변경 없음"; else git commit -m "자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')" && git pull --rebase -q && git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
