<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8553d"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><title>포항 남구 맛집</title>
<style>
:root{--c:#e8553d;--bg:#fffaf7;--tx:#2b2220;--mu:#8a7b76;--ln:#efe4df}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--tx)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 14px 0;border-bottom:1px solid var(--ln)}
h1{font-size:20px;margin:0 0 2px}.upd{font-size:12px;color:var(--mu);margin-bottom:8px}
.tabs{display:flex;gap:6px}.tab{flex:1;padding:10px;border:0;background:none;font-size:16px;font-weight:600;color:var(--mu);border-bottom:3px solid transparent}
.tab.on{color:var(--c);border-color:var(--c)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--ln);background:#fff;border-radius:16px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--c);color:#fff;border-color:var(--c)}
main{padding:10px 12px 40px}.rule{font-size:12px;color:var(--mu);margin:2px 2px 10px}
.card{display:flex;gap:10px;background:#fff;border:1px solid var(--ln);border-radius:14px;padding:10px;margin-bottom:10px;cursor:pointer}
.rk{min-width:28px;font-size:20px;font-weight:800;color:var(--c);text-align:center;padding-top:2px}
.th{width:84px;height:84px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#f3ece8}
.bd{flex:1;min-width:0}.nm{font-weight:700;font-size:16px;margin:0 0 2px}.ct{font-size:12px;color:var(--mu)}
.row{font-size:13px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row b{color:var(--mu);font-weight:500;margin-right:4px}
.mt{font-size:11px;color:var(--mu);margin-top:4px}.tg{display:inline-block;font-size:11px;background:#fdebe6;color:var(--c);border-radius:8px;padding:1px 6px;margin-right:4px}
#dt{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;display:none}
#dt .top{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;border-bottom:1px solid var(--ln)}
#dt .back{border:0;background:none;font-size:24px;padding:4px 8px}#dt .ttl{font-weight:700;font-size:17px}
#dt .ct2{padding:12px 14px 40px}.hero{width:100%;max-height:260px;object-fit:cover;border-radius:12px;background:#f3ece8}
.sec{margin-top:16px}.sec h3{font-size:15px;margin:0 0 6px}table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:7px 4px;border-bottom:1px solid var(--ln)}td:last-child{text-align:right;white-space:nowrap}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{flex:1;text-align:center;padding:11px;border-radius:10px;background:var(--c);color:#fff;text-decoration:none;font-weight:600;font-size:14px}
.btn.alt{background:#fff;color:var(--c);border:1px solid var(--c)}.kv{font-size:14px;line-height:1.6}.kv b{color:var(--mu);font-weight:500;display:inline-block;min-width:74px}
.src{font-size:12px;color:var(--mu);word-break:break-all}.src a{color:var(--mu)}.empty{color:var(--mu);text-align:center;padding:40px 0}
</style></head><body>
<header><h1>포항 남구 맛집</h1><div class="upd" id="upd">불러오는 중…</div>
<div class="tabs"><button class="tab on" data-cat="nam">포항 남구</button><button class="tab" data-cat="ocheon">문덕·오천</button></div>
<div class="chips" id="chips"></div></header>
<main><div class="rule" id="rule"></div><div id="list"></div></main>
<div id="dt"><div class="top"><button class="back" id="back" aria-label="뒤로">‹</button><div class="ttl" id="dtt"></div></div><div class="ct2" id="dtc"></div></div>
<script>
const NA='정보 없음',TAGS=['전체','술집','횟집','뒷고기','직장인 가성비'];
let D=null,cat='nam',tag='전체';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>v==null?NA:Number(v).toLocaleString('ko-KR');
const img=r=>r.photo?r.photo:'placeholder.svg';
function chips(){document.getElementById('chips').innerHTML=TAGS.map(t=>`<button class="chip ${t===tag?'on':''}" data-t="${t}">${t==='술집'?'술집(술한잔)':t}</button>`).join('')}
function list(){
  const L=D.restaurants.filter(r=>r.cat===cat&&(tag==='전체'||(r.tags||[]).includes(tag))).sort((a,b)=>a.rank-b.rank);
  document.getElementById('list').innerHTML=L.length?L.map((r,i)=>`
  <div class="card" data-n="${esc(r.name)}"><div class="rk">${i+1}</div>
  <img class="th" loading="lazy" src="${img(r)}" alt="" onerror="this.src='placeholder.svg'">
  <div class="bd"><p class="nm">${esc(r.name)}</p><div class="ct">${esc(r.category||NA)}${(r.tags||[]).map(t=>` <span class="tg">${esc(t)}</span>`).join('')}</div>
  <div class="row"><b>가격대</b>${esc(r.price_range||NA)}</div>
  <div class="row"><b>영업</b>${esc(r.hours||NA)}</div>
  <div class="row"><b>휴무</b>${esc(r.holiday||NA)}</div>
  <div class="mt">방문자리뷰 ${num(r.reviews)} · 블로그 ${num(r.blogs)} · X(7일) ${num(r.sns)}</div></div></div>`).join(''):'<div class="empty">이 조건의 맛집이 아직 없어요</div>';
}
function detail(n){
  const r=D.restaurants.find(x=>x.name===n);if(!r)return;
  document.getElementById('dtt').textContent=r.name;
  const menus=(r.menus||[]).length?`<table>${r.menus.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.price||NA)}</td></tr>`).join('')}</table>`:`<div class="kv">${r.menu_note?esc(r.menu_note):NA}</div>`;
  const mlink=r.menu_url?`<div class="src" style="margin-top:6px"><a href="${esc(r.menu_url)}" target="_blank" rel="noopener">네이버 플레이스 메뉴 탭 열기</a></div>`:'';
  const kakao='https://map.kakao.com/link/search/'+encodeURIComponent(r.name+' 포항');
  document.getElementById('dtc').innerHTML=`<img class="hero" src="${img(r)}" alt="" onerror="this.src='placeholder.svg'">
  ${r.photo?'<div class="src">사진: 네이버 플레이스 업체 등록 사진</div>':''}
  <div class="sec kv"><div><b>분류</b>${esc(r.category||NA)}</div><div><b>대표 가격대</b>${esc(r.price_range||NA)}</div>
  <div><b>영업시간</b>${esc(r.hours||NA)}</div><div><b>휴무일</b>${esc(r.holiday||NA)}</div>
  <div><b>주소</b>${esc(r.address||NA)}</div><div><b>전화</b>${r.phone&&r.phone!==NA?`<a href="tel:${esc(r.phone)}">${esc(r.phone)}</a>`:NA}</div>
  <div><b>평점</b>${r.rating!=null?esc(r.rating)+' / 5 (네이버)':NA}</div></div>
  <div class="btns"><a class="btn" href="${esc(r.map_url)}" target="_blank" rel="noopener">네이버 지도</a><a class="btn alt" href="${kakao}" target="_blank" rel="noopener">카카오맵</a></div>
  <div class="sec"><h3>상세 메뉴</h3>${menus}${mlink}</div>
  <div class="sec"><h3>순위 지표</h3><div class="kv"><div><b>방문자 리뷰</b>${num(r.reviews)}</div><div><b>블로그·카페</b>${num(r.blogs)}</div>
  <div><b>X 7일 언급</b>${num(r.sns)}${r.sns_measured?` (${esc(r.sns_measured)} 측정)`:''}</div></div></div>
  <div class="sec src">출처: ${(r.sources||[]).map(s=>`<a href="${esc(s)}" target="_blank" rel="noopener">${esc(s)}</a>`).join('<br>')||NA}<br>선정: ${esc(r.found_by||'')} · 갱신 ${esc(r.updated||'')}</div>`;
  const dt=document.getElementById('dt');dt.style.display='block';dt.scrollTop=0;history.pushState({d:1},'');
}
document.addEventListener('click',e=>{
  const t=e.target.closest('.tab');if(t){cat=t.dataset.cat;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));list();return}
  const c=e.target.closest('.chip');if(c){tag=c.dataset.t;chips();list();return}
  const k=e.target.closest('.card');if(k)detail(k.dataset.n);
});
document.getElementById('back').onclick=()=>history.back();
addEventListener('popstate',()=>{document.getElementById('dt').style.display='none'});
fetch('data.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{D=d;
  document.getElementById('upd').textContent='마지막 업데이트: '+d.last_updated;
  document.getElementById('rule').textContent='순위 기준: '+d.ranking_rule;chips();list();})
 .catch(()=>document.getElementById('list').innerHTML='<div class="empty">데이터를 불러오지 못했어요</div>');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
